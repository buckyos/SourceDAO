name: SourceDAO Bootstrap Tools Image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: usdb-tools-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, publish, and attest
    if: github.repository == 'buckyos/SourceDAO'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.prepare.outputs.image }}
      reference: ${{ steps.prepare.outputs.image }}@${{ steps.build.outputs.digest }}
      revision: ${{ steps.prepare.outputs.revision }}
      scan_enforcement: ${{ steps.prepare.outputs.scan_enforcement }}
    steps:
      - name: Check out source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare immutable candidate identity
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$(git cat-file -t "$GITHUB_REF")" == "tag" ]] || {
              echo "release image requires an annotated tag: $GITHUB_REF" >&2
              exit 1
            }
            [[ "$revision" == "$(git rev-list -n 1 "$GITHUB_REF")" ]] || {
              echo "checked-out revision does not match release tag target" >&2
              exit 1
            }
          else
            [[ "$revision" == "$GITHUB_SHA" ]] || {
              echo "checked-out revision $revision does not match workflow revision $GITHUB_SHA" >&2
              exit 1
            }
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$revision" refs/remotes/origin/main || {
            echo "SourceDAO tools images may only be published from main history: $revision" >&2
            exit 1
          }

          image="ghcr.io/buckyos/sourcedao-bootstrap-tools"
          tag="${image}:git-${revision}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scan_enforcement="report-only"
          if [[ "$GITHUB_REF_TYPE" == "tag" &&
                "$GITHUB_REF_NAME" =~ ^usdb-(testnet|mainnet)-v[0-9]+-r[1-9][0-9]*$ ]]; then
            scan_enforcement="strict"
          fi
          {
            echo "image=$image"
            echo "revision=$revision"
            echo "scan_enforcement=$scan_enforcement"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.usdb-tools
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.prepare.outputs.revision }}
            org.opencontainers.image.version=sourcedao-bootstrap-tools
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.prepare.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record candidate reference
        shell: bash
        run: |
          {
            echo "### SourceDAO bootstrap tools image candidate"
            echo
            echo '```text'
            echo "${{ steps.prepare.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Source revision: \`${{ steps.prepare.outputs.revision }}\`"
          } >>"$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan SourceDAO tools image
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-image-security.yml
    with:
      artifact_name: sourcedao-tools-image-security
      enforcement: ${{ needs.publish.outputs.scan_enforcement }}
      image_reference: ${{ needs.publish.outputs.reference }}
      source_revision: ${{ needs.publish.outputs.revision }}
