name: USDB Fast

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usdb-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sourcedao_fast:
    name: SourceDAO contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out SourceDAO
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SourceDAO fast gate
        run: npm run test:usdb:fast

  publish_tools_image:
    name: Publish SourceDAO bootstrap tools
    needs: sourcedao_fast
    if: github.repository == 'buckyos/SourceDAO' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/usdb-tools-image.yml
